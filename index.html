<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c97945">
<title>我的吉他谱库</title>
<style>
:root {
  --bg: #f6f3ee;
  --surface: #fffdfa;
  --surface-muted: #f0ebe3;
  --text: #252321;
  --muted: #766f68;
  --accent: #c97945;
  --accent-dark: #9c552c;
  --accent-soft: #f7dfcf;
  --border: #e6ded5;
  --shadow: 0 2px 10px rgba(58, 42, 30, 0.07);
  --shadow-hover: 0 10px 24px rgba(58, 42, 30, 0.13);
  --sidebar-w: 224px;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--text);
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.45;
}
body.viewer-open { overflow: hidden; }
button, input { font: inherit; }
button {
  border: 0;
  color: inherit;
  background: none;
  cursor: pointer;
}
button:focus-visible, input:focus-visible {
  outline: 3px solid rgba(201, 121, 69, 0.42);
  outline-offset: 2px;
}
[hidden] { display: none !important; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}

.app-layout { display: flex; min-height: 100vh; }
.sidebar {
  position: sticky;
  top: 0;
  z-index: 40;
  width: var(--sidebar-w);
  height: 100vh;
  flex: 0 0 var(--sidebar-w);
  overflow-y: auto;
  border-right: 1px solid var(--border);
  background: var(--surface);
}
.sidebar-header {
  padding: 19px 18px 16px;
  border-bottom: 1px solid var(--border);
}
.library-name {
  display: block;
  overflow: hidden;
  font-size: 17px;
  font-weight: 750;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.library-name span { color: var(--accent); }
.library-stats {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}
.sidebar-nav { padding: 8px 0 16px; }
.sidebar-item {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 9px;
  padding: 10px 16px 10px 13px;
  border-left: 3px solid transparent;
  color: var(--muted);
  text-align: left;
  transition: background 120ms ease, color 120ms ease;
}
.sidebar-item:hover { background: #faf5ef; color: var(--text); }
.sidebar-item.active {
  border-left-color: var(--accent);
  color: var(--text);
  background: var(--surface-muted);
  font-weight: 700;
}
.sidebar-item .count {
  min-width: 23px;
  margin-left: auto;
  padding: 1px 7px;
  border-radius: 99px;
  color: var(--muted);
  background: #ebe5de;
  font-size: 11px;
  text-align: center;
}
.sidebar-item.active .count { color: #fff; background: var(--accent); }

.main-content { min-width: 0; flex: 1; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  min-height: 68px;
  align-items: center;
  gap: 14px;
  padding: max(12px, env(safe-area-inset-top)) 20px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 253, 250, 0.94);
  backdrop-filter: blur(12px);
}
.topbar-title {
  min-width: 0;
  flex: 0 1 auto;
}
.topbar-title h1, .topbar-title h2 {
  overflow: hidden;
  margin: 0;
  font-size: 17px;
  font-weight: 750;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.topbar-title p {
  overflow: hidden;
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.icon-button {
  display: inline-grid;
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 9px;
  font-size: 21px;
}
.icon-button:hover { background: var(--surface-muted); }
.menu-btn { display: none; }
.search-box {
  position: relative;
  min-width: 150px;
  max-width: 520px;
  flex: 1 1 320px;
  margin-left: auto;
}
.search-box > span {
  position: absolute;
  top: 50%;
  left: 11px;
  color: var(--muted);
  transform: translateY(-50%);
}
.search-box input {
  width: 100%;
  padding: 9px 12px 9px 33px;
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  background: #faf8f5;
}
.search-box input:focus { border-color: var(--accent); background: #fff; }

.section-summary {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 18px 20px 0;
  color: var(--muted);
  font-size: 13px;
}
.section-summary strong { color: var(--text); font-size: 14px; }
.song-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
  gap: 15px;
  padding: 14px 20px 28px;
}
.song-card {
  overflow: hidden;
  border: 1px solid transparent;
  border-radius: 12px;
  background: var(--surface);
  box-shadow: var(--shadow);
  text-align: left;
  transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
}
.song-card:hover {
  z-index: 1;
  border-color: var(--accent-soft);
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
}
.song-card:active { transform: translateY(0) scale(0.99); }
.song-card img {
  display: block;
  width: 100%;
  aspect-ratio: 3 / 4;
  background: #ece7df;
  object-fit: cover;
  object-position: center top;
}
.song-info { padding: 10px 11px 12px; }
.song-title {
  overflow: hidden;
  font-size: 14px;
  font-weight: 720;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.song-artist {
  overflow: hidden;
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.page-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 14px;
  padding: 20px;
}
.page-card {
  position: relative;
  overflow: hidden;
  border: 1px solid transparent;
  border-radius: 10px;
  background: var(--surface);
  box-shadow: var(--shadow);
  text-align: left;
  transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
}
.page-card:hover {
  z-index: 1;
  border-color: var(--accent-soft);
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
}
.page-card:active { transform: translateY(0) scale(0.99); }
.page-card img {
  display: block;
  width: 100%;
  aspect-ratio: 3 / 4;
  background: #ece7df;
  object-fit: contain;
}
.page-num {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 3px 8px;
  border-radius: 99px;
  color: #fff;
  background: rgba(32, 25, 20, 0.74);
  font-size: 11px;
  font-weight: 700;
}
.page-card.resume .page-num { background: var(--accent); }

.empty {
  display: grid;
  min-height: 280px;
  place-content: center;
  gap: 8px;
  padding: 36px;
  color: var(--muted);
  text-align: center;
}
.empty .big { font-size: 42px; }

.sidebar-overlay {
  position: fixed;
  inset: 0;
  z-index: 39;
  background: rgba(31, 24, 19, 0.36);
}

.viewer {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #080808;
  color: #fff;
}
.viewer-toolbar {
  position: fixed;
  top: 0;
  right: 0;
  left: 0;
  z-index: 4;
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: max(8px, env(safe-area-inset-top)) 10px 8px;
  pointer-events: none;
}
.viewer-toolbar > * { pointer-events: auto; }
.viewer-control {
  min-height: 36px;
  padding: 0 10px;
  border-radius: 8px;
  color: rgba(255, 255, 255, 0.9);
  background: rgba(255, 255, 255, 0.12);
  font-size: 12px;
  font-weight: 700;
}
.viewer-control:hover, .viewer-control.active { color: #fff; background: var(--accent); }
.viewer-close {
  padding: 0;
  background: rgba(0, 0, 0, 0.68);
  backdrop-filter: blur(8px);
  font-size: 24px;
}
.viewer-heading {
  min-width: 0;
  overflow: hidden;
  justify-self: start;
  padding: 5px 9px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.68);
  backdrop-filter: blur(8px);
}
.viewer-title {
  display: block;
  overflow: hidden;
  color: #fff;
  font-size: 13px;
  font-weight: 650;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.viewer-hint {
  display: block;
  overflow: hidden;
  margin-top: 1px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.viewer-actions {
  display: flex;
  max-width: min(62vw, 430px);
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  border-radius: 9px;
  background: rgba(0, 0, 0, 0.42);
  backdrop-filter: blur(8px);
}
.viewer-actions::-webkit-scrollbar { display: none; }
.viewer-actions .viewer-control { flex: 0 0 auto; white-space: nowrap; }
.zoom-control {
  display: flex;
  min-height: 36px;
  flex: 0 0 auto;
  align-items: center;
  gap: 7px;
  padding: 0 9px;
  border-radius: 8px;
  color: rgba(255, 255, 255, 0.9);
  background: rgba(255, 255, 255, 0.12);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.zoom-control input {
  width: 86px;
  margin: 0;
  accent-color: var(--accent);
  cursor: pointer;
}
.zoom-value { min-width: 34px; text-align: right; }
.viewer-stage {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 0 72px;
  touch-action: none;
}
.viewer-stage > img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  user-select: none;
  object-fit: contain;
  transform-origin: center center;
}
.viewer-stage[data-fit="width"] {
  align-items: flex-start;
  overflow: auto;
  padding: 0 14px;
  touch-action: pan-y pinch-zoom;
}
.viewer-stage[data-fit="width"] > img {
  width: 100%;
  max-width: 100%;
  max-height: none;
  height: auto;
}
.viewer-stage[data-fit="horizontal"] {
  display: block;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 0 72px;
  scroll-padding-inline: 72px;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
  touch-action: pan-x pinch-zoom;
}
.viewer-stage[data-fit="vertical"] {
  display: block;
  overflow-x: auto;
  overflow-y: auto;
  padding: 0 clamp(14px, 4vw, 56px);
  scrollbar-width: none;
  touch-action: pan-y pinch-zoom;
}
.viewer-stage[data-fit="horizontal"]::-webkit-scrollbar,
.viewer-stage[data-fit="vertical"]::-webkit-scrollbar { display: none; }
.viewer-pages { min-height: 100%; }
.viewer-stage[data-fit="horizontal"] .viewer-pages {
  display: flex;
  width: max-content;
  height: 100%;
  align-items: center;
  gap: 16px;
}
.viewer-stage[data-fit="vertical"] .viewer-pages {
  display: grid;
  width: min(100%, 1040px);
  margin: 0 auto;
  gap: 18px;
}
.viewer-sheet {
  position: relative;
  overflow: hidden;
  border-radius: 4px;
  background: #151515;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.34);
}
.viewer-stage[data-fit="horizontal"] .viewer-sheet {
  height: 100%;
  flex: 0 0 auto;
  scroll-snap-align: center;
}
.viewer-stage[data-fit="horizontal"] .viewer-sheet img {
  display: block;
  width: auto;
  max-width: none;
  height: 100%;
  max-height: 100%;
  object-fit: contain;
}
.viewer-stage[data-fit="vertical"] .viewer-sheet img {
  display: block;
  width: 100%;
  height: auto;
}
.viewer-sheet-number {
  position: absolute;
  top: 9px;
  left: 9px;
  padding: 4px 8px;
  border-radius: 99px;
  color: #fff;
  background: rgba(0, 0, 0, 0.68);
  font-size: 11px;
  font-weight: 700;
  pointer-events: none;
}
.viewer-nav {
  position: fixed;
  top: 50%;
  z-index: 3;
  display: grid;
  width: 42px;
  height: 64px;
  place-items: center;
  border-radius: 10px;
  color: #fff;
  background: rgba(0, 0, 0, 0.55);
  font-size: 38px;
  line-height: 1;
  transform: translateY(-50%);
}
.viewer-nav:hover { background: rgba(0, 0, 0, 0.72); }
.viewer-nav:disabled { cursor: default; opacity: 0.18; }
.viewer-nav.prev { left: 14px; }
.viewer-nav.next { right: 14px; }
.viewer-footer {
  position: fixed;
  bottom: 0;
  left: 50%;
  z-index: 4;
  display: flex;
  width: max-content;
  max-width: calc(100vw - 112px);
  justify-content: center;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 8px max(6px, env(safe-area-inset-bottom));
  border-radius: 11px 11px 0 0;
  background: rgba(0, 0, 0, 0.66);
  backdrop-filter: blur(8px);
  transform: translateX(-50%);
}
.page-btn {
  width: 32px;
  height: 32px;
  flex: 0 0 auto;
  border-radius: 7px;
  color: rgba(255, 255, 255, 0.72);
  background: rgba(255, 255, 255, 0.13);
  font-size: 12px;
  font-weight: 700;
}
.page-btn:hover, .page-btn.active { color: #fff; background: var(--accent); }
.viewer-next-song {
  position: fixed;
  bottom: max(12px, env(safe-area-inset-bottom));
  left: 14px;
  z-index: 5;
  min-height: 40px;
  padding: 0 14px;
  border-radius: 10px;
  color: #fff;
  background: var(--accent);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  font-size: 13px;
  font-weight: 750;
}
.viewer-next-song:hover { background: var(--accent-dark); }
.viewer-next-song:disabled { cursor: default; opacity: 0.36; }

.loading {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: var(--bg);
}

@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: calc(var(--sidebar-w) * -1 - 12px);
    box-shadow: 4px 0 18px rgba(40, 28, 20, 0.16);
    transition: left 180ms ease;
  }
  .sidebar.open { left: 0; }
  .menu-btn { display: inline-grid; }
  .topbar { gap: 8px; padding-right: 12px; padding-left: 12px; }
  .topbar-title { min-width: 0; }
  .topbar-title p { display: none; }
  .topbar-title h1, .topbar-title h2 { font-size: 15px; }
  .search-box { min-width: 0; flex-basis: 130px; }
  .section-summary { padding: 14px 12px 0; }
  .song-grid {
    grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap: 9px;
    padding: 10px 12px 24px;
  }
  .song-info { padding: 8px 9px 10px; }
  .page-grid {
    grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
    gap: 9px;
    padding: 12px;
  }
  .viewer-stage { padding-right: 48px; padding-left: 48px; }
  .viewer-nav { width: 32px; height: 50px; font-size: 31px; }
  .viewer-nav.prev { left: 7px; }
  .viewer-nav.next { right: 7px; }
  .viewer-heading { min-width: 0; }
  .viewer-actions .viewer-control { padding: 0 8px; }
  .viewer-stage[data-fit="horizontal"] {
    padding-right: 48px;
    padding-left: 48px;
    scroll-padding-inline: 48px;
  }
  .viewer-stage[data-fit="vertical"] { padding-right: 8px; padding-left: 8px; }
}

@media (min-width: 769px) {
  .sidebar-overlay { display: none !important; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="我的吉他谱库">
</head>
<body>
<div class="loading" id="loading" role="status">正在加载谱库…</div>
<div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

<div class="app-layout">
  <nav class="sidebar" id="sidebar" aria-label="谱库筛选">
    <div class="sidebar-header">
      <span class="library-name">🎸 <span id="libraryName">我的吉他谱库</span></span>
      <span class="library-stats" id="libraryStats"></span>
    </div>
    <div class="sidebar-nav" id="sidebarNav"></div>
  </nav>

  <main class="main-content">
    <section class="view" id="home-view" aria-labelledby="libraryTitle">
      <header class="topbar">
        <button class="menu-btn icon-button" id="menuBtn" type="button" aria-label="打开谱库筛选" aria-expanded="false">☰</button>
        <div class="topbar-title">
          <h1 id="libraryTitle">我的吉他谱库</h1>
          <p id="librarySummary"></p>
        </div>
        <label class="search-box" for="searchInput">
          <span aria-hidden="true">⌕</span>
          <span class="sr-only">搜索歌手、歌名、演奏方式或标签</span>
          <input id="searchInput" type="search" placeholder="搜索歌手、歌名、演奏方式或标签" autocomplete="off">
        </label>
      </header>
      <div class="section-summary" id="filterSummary" aria-live="polite"></div>
      <div class="song-grid" id="songGrid"></div>
    </section>

    <section class="view" id="song-view" aria-labelledby="songTitle" hidden>
      <header class="topbar">
        <button class="icon-button" id="backBtn" type="button" aria-label="返回谱库">←</button>
        <div class="topbar-title">
          <h2 id="songTitle"></h2>
          <p id="songMeta"></p>
        </div>
      </header>
      <div class="page-grid" id="pageGrid"></div>
    </section>
  </main>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="吉他谱阅读器" hidden>
  <div class="viewer-toolbar">
    <button class="viewer-control viewer-close" id="viewerClose" type="button" aria-label="关闭阅读器">×</button>
    <div class="viewer-heading">
      <span class="viewer-title" id="viewerTitle"></span>
      <span class="viewer-hint" id="viewerHint">双击或滚轮缩放；两指缩放；左右箭头翻页</span>
    </div>
    <div class="viewer-actions">
      <button class="viewer-control active" id="fitPageBtn" type="button" aria-pressed="true">整页</button>
      <label class="zoom-control" id="zoomControl" for="zoomSlider">
        <span>缩放</span>
        <input id="zoomSlider" type="range" min="100" max="500" step="10" value="100" aria-label="谱面缩放比例">
        <output class="zoom-value" id="zoomValue" for="zoomSlider">100%</output>
      </label>
      <button class="viewer-control" id="fitWidthBtn" type="button" aria-pressed="false">宽度</button>
      <button class="viewer-control" id="horizontalBtn" type="button" aria-label="横向并排阅读" aria-pressed="false">横排</button>
      <button class="viewer-control" id="verticalBtn" type="button" aria-label="竖直滚动阅读" aria-pressed="false">纵滚</button>
    </div>
  </div>
  <button class="viewer-nav prev" id="navPrev" type="button" aria-label="上一页">‹</button>
  <div class="viewer-stage" id="viewerStage" data-fit="page">
    <img id="viewerImg" src="" alt="" draggable="false">
    <div class="viewer-pages" id="viewerPages" hidden></div>
  </div>
  <button class="viewer-nav next" id="navNext" type="button" aria-label="下一页">›</button>
  <nav class="viewer-footer" id="viewerFooter" aria-label="页码导航"></nav>
  <button class="viewer-next-song" id="nextSongBtn" type="button">下一首 →</button>
</div>

<script src="prelude.js" defer></script>
<script src="app.js" defer></script>

</body>
</html><!-- compact build complete -->
